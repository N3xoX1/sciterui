<html window-frame="solid"
   >
    <head>
        <title>Test</title>
        <style>

html { background: gold; }

        </style>
        <script>

document.on("click", "button#close", function() {
  Window.this.close();
});

document.on("ready", function() {
  let [x,y,w,h] = Window.this.box("xywh", "border", "monitor", false);
  document.body.append(<p>box: {x},{y},{w},{h}</p>);
});


        </script>
    </head>

    <header>
      <caption role="window-caption">Window caption</caption>
    </header>

    <body>

<p>window-frame="solid"</p>

<button #close>Close</button> 

    </body>
</html>
