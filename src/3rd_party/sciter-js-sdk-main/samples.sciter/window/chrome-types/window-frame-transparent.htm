<html 
  window-frame="transparent" 
  window-width=420px 
  window-height=420px >
    <head>
        <title>Test</title>
        <style>

html { 
  background: rgba(0,0,0,0); 
  overflow:visible;
  width:420px;
  height: 420px;
}

body {
  width:400px;
  height:400px;
  border-radius:50%;
  margin:*;
  background:gold;
  content-vertical-align: middle;
  text-align: center;
  transform: scale(0.1);
}

body.ready {
  transform: scale(1);
  transition: transform 400ms quad-out;
}

body > button {
  display:block;
  margin:0 *;
}

        </style>
        <script>

//Window.this.mousePassthrough = true; // enable it for "HUD" window
Window.this.isTopmost = true;

document.on("click", "button#close", function() {
  Window.this.close();
});

post(function() { document.body.classList.add("ready") });

document.timer(400ms, function() {
  // setup opaque window shape (after animation). For mouse click-through purposes.
  Window.this.shape(document.body);  
});

        </script>
    </head>

    <body>

<div role="window-caption">
  <p>window-frame="transparent"</p>
  <p>window may have arbitrary shape</p>
</div>
<button #close>Close</button>

    </body>
</html>
