<html>
    <head>
        <title>Test</title>
        <style>

select { display:block; }

        </style>
        <script>

document.$("select").on("change", function() {
  document.body.append(<text>change: {this.value}</text>);   
});

        </script>
    </head>
    <body>

<select|switch>
   <option value="70" aria-label="70%, minimum">70%</option>
   <option value="80">80%</option>
   <option value="90">90%</option>
   <option value="100" selected>100%</option>
   <option value="120" aria-label="120%, maximum">120%</option>
</select>

    </body>
</html>
