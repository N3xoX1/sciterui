<html>
  <head>
  <title></title>
<style>

  body
  {
    /*font-rendering-mode: classic;*/
    flow:horizontal-flow;
    background: url(back.png) repeat;
    color:gray;
    margin:0; padding:10px;
    border-spacing:10px;
  }

  div {
    width:*; height:100px; padding:6px; 
    transition: background ease 0.5s;
  }
  div:nth-child(2n) { clear:right; }
  

  //white, orange, rgba(0,0,204,0.5)
  //red, yellow, green, blue, rgba(255,0,255,0.5) 
  div.gradient-ellipse-farthest-corner
  {
    background: radial-gradient(ellipse farthest-corner at 25% 25%, red, yellow, green, blue, rgba(255,0,255,0.5) );
  }
  div.gradient-ellipse-farthest-corner:hover
  {
    background: radial-gradient(ellipse farthest-corner at 75% 75%, red, yellow, green, blue, rgba(255,0,255,0.5) );
  }
  
  div.gradient-ellipse-farthest-side
  {
    background: radial-gradient(ellipse farthest-side at 25% 25%, red, yellow, green, blue, rgba(255,0,255,0.5) );
  }

  div.gradient-ellipse-farthest-side:hover
  {
    background: radial-gradient(ellipse farthest-side at 75% 75%, red, yellow, green, blue, rgba(255,0,255,0.5) );
  }


  div.gradient-ellipse-closest-corner
  {
    background: radial-gradient(ellipse closest-corner at 25% 25%, red, yellow, green, blue, rgba(255,0,255,0.5) );
  }

  div.gradient-ellipse-closest-corner:hover
  {
    background: radial-gradient(ellipse closest-corner at 75% 75%, red, yellow, green, blue, rgba(255,0,255,0.5) );
  }


  div.gradient-ellipse-closest-side
  {
    background: radial-gradient(ellipse closest-side at 25% 25%, red, yellow, green, blue, rgba(255,0,255,0.5) );
  }

  div.gradient-ellipse-closest-side:hover 
  {
    background: radial-gradient(ellipse closest-side at 75% 75%, red, yellow, green, blue, rgba(255,0,255,0.5) );
  }
  
  div.gradient-circle-farthest-corner
  {
    background: radial-gradient(circle farthest-corner at 75% 75%, white, orange 50%, rgba(0,0,204,0.5));
  }
  div.gradient-circle-farthest-corner:hover
  {
    background: radial-gradient(circle farthest-corner at 75% 75%, white, orange 80%, rgba(0,0,204,0.5));
  }
    
  div.gradient-circle-farthest-side
  {
    background: radial-gradient(circle farthest-side at 75% 75%, white, orange, rgba(0,0,204,0.5));
  }

  div.gradient-circle-farthest-side:hover
  {
    background: radial-gradient(circle farthest-side at 50% 50%, white, orange, rgba(0,0,204,0.5));
  }


  div.gradient-circle-closest-corner
  {
    background: radial-gradient(circle closest-corner at 75% 75%, white, orange, rgba(0,0,204,0.5));
  }

  div.gradient-circle-closest-corner:hover {
    background: radial-gradient(circle farthest-corner at 75% 75%, white, orange, rgba(0,0,204,0.5));
  }

  div.gradient-circle-closest-side
  {
    background: radial-gradient(circle closest-side at 75% 75%, white, orange, rgba(0,0,204,0.5));
  }

  div.gradient-circle-closest-side
  {
    background: radial-gradient(circle closest-side at 75% 75%, white, orange, rgba(0,0,204,0.5));
  }
  div.gradient-circle-closest-side:hover
  {
    background: radial-gradient(circle farthest-side at 75% 75%, white, orange, rgba(0,0,204,0.5));
  }
  
</style>
  </head>
<body>

  <div .gradient-ellipse-farthest-corner>ellipse farthest corner</div>
  <div .gradient-circle-farthest-corner>circle farthest corner</div>
  <div .gradient-ellipse-farthest-side>ellipse farthest side</div>  
  <div .gradient-circle-farthest-side>circle farthest side</div>

  <div .gradient-ellipse-closest-corner>ellipse closest corner</div>
  <div .gradient-circle-closest-corner>circle closest corner</div>
  <div .gradient-ellipse-closest-side>ellipse closest side</div>  
  <div .gradient-circle-closest-side>circle closest side</div>

</body>
</html>
