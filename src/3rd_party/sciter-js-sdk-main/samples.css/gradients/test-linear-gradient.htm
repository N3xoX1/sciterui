<html>
  <head>
  <title></title>
<style>

  body
  {
    /*font-rendering-mode: ui ;*/
    flow:horizontal-flow;
    background: url(back.png) repeat;
    color:white;
    margin:0; padding:10px;
    border-spacing:10px;
  }

  div { 
    width:*; height:100px; 
    padding:6px; /*border-radius:10px;*/ 
    transition: background linear 0.5s;
  }
        
  div:nth-child(2n) { clear:right; }
  
  @const START: rgb(255,0,0);
  @const END: rgba(0,0,255,0.5);

  div.gradient
  {
    background: linear-gradient(to top, @START, @END);
  }
  div.gradient:hover
  {
    background: linear-gradient(to top, @END, @START);
  }
    
  div.gradient-2
  {
    background: linear-gradient(to left, red, yellow, green, blue, magenta);
  }
  div.gradient-2:hover {
    background: linear-gradient(to right, red, yellow, green, blue, magenta);
  }
  
  div.diagonal-gradient
  {
    background: linear-gradient(to top left, @START, @END);
  }
  div.diagonal-gradient:hover
  {
    background: linear-gradient(to bottom right, @START, @END);
  }

  div.diagonal-gradient-2
  {
    background: linear-gradient(to top left, red, yellow, green, blue, magenta);
  }
  div.diagonal-gradient-2:hover
  {
    background: linear-gradient(to bottom right, red, yellow, green, blue, magenta);
  }
  
  div.angle-gradient
  {
    background: linear-gradient(45deg, @START, @END);
  }

  div.angle-gradient:hover
  {
    background: linear-gradient(135deg, @START, @END);
  }

  div.angle-gradient-2
  {
    background: linear-gradient(45deg, red, yellow, green, blue, magenta);
  }

  div.angle-gradient-2:hover
  {
    background: linear-gradient(-45deg, red, yellow, green, blue, magenta);
  }

  
</style>
<script type="text/tiscript"></script>
  </head>
<body>

  <div .gradient>Gradient 1</div>
  <div .gradient-2>Gradient 2</div>
  <div .diagonal-gradient>Diagonal gradient 1</div>
  <div .diagonal-gradient-2>Diagonal gradient 1</div>
  <div .angle-gradient>Angle gradient 1</div>
  <div .angle-gradient-2>Angle gradient 2</div>

</body>
</html>
