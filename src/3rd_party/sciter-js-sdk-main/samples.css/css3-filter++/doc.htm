    <body>

SVG filters reformulated as CSS filters. 

For example: 

SVG's filter like 

<pre>
    &lt;feGaussianBlur stdDeviation="5" />
</pre>

in CSS becomes: 

<pre>
    filter: fe-gaussian-blur(std-deviation:5);
</pre>

with the preservation of parameters semantic.
