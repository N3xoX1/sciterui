<html>
  <head>
    <title></title>
    <style>

    body {
      background:gold;
    }

    div.circle
    {
      background:#000;
      border-radius:100px;
      size:200px;
      margin:1em;
    }
  
    .point-light
    {
      filter: fe-specular-lighting(specular-exponent:20, 
                                   lighting-color: #bbbbbb, 
                                   lighting-source: point(x:50px,y:75px, z:200px),
                                   result:"specout")
              fe-composite(in2:"specout", operator: arithmetic(0, 1, 1, 0));
              

    }
    .distant-light
    {
      filter: fe-specular-lighting(specular-exponent:20, 
                                   lighting-color: #bbbbbb, 
                                   lighting-source: distant(azimuth:45deg, elevation:75deg),
                                   result:"specout")
              fe-composite(in2:"specout", operator: arithmetic(0, 1, 1, 0));
              

    }
    .spot-light
    {
      filter: fe-specular-lighting(specular-exponent:4, 
                                   specular-constant:1.5, 
                                   lighting-color: #bbbbbb, 
                                   lighting-source: spot( x:600px, y:600px, z:400px,
                                                          points-at-x:200px, points-at-y:200px,
                                                          limiting-cone-angle: 10deg ),
                                   result:"specout")
              fe-composite(in2:"specout", operator: arithmetic(0, 1, 1, 0));
              

    }


    </style>
  </head>
<body>

<h2>Point light</h2>
<div.circle.point-light />

<h2>Distant light</h2>
<div.circle.distant-light />

<h2>Spot light</h2>
<div.circle.spot-light />


</body>
</html>
